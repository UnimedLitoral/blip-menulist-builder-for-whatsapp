
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.app{display:grid;grid-template-columns:1fr 300px;gap:0;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
.editor{
  padding:1.5rem;
  overflow-y:auto;
  max-height:780px;
  border-right:1px solid rgba(0,0,0,.06);
  background:
    radial-gradient(circle at top left, rgba(37,211,102,.06), transparent 280px),
    #f8fafc;
}

.sec-lbl{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#64748b;
  margin-bottom:12px;
}

.fg{
  margin-bottom:1.15rem;
}

.fl{
  font-size:12px;
  font-weight:600;
  color:#334155;
  margin-bottom:7px;
  display:block;
}

.fl span{
  color:#94a3b8;
  font-size:11px;
  margin-left:4px;
  font-weight:500;
}

input[type=text],
textarea{
  width:100%;
  font-size:13px;
  padding:12px 14px;
  border-radius:14px;
  border:1px solid #e2e8f0;
  background:#fff;
  color:#0f172a;
  font-family:var(--font-sans);
  resize:vertical;
  transition:
    border-color .18s ease,
    box-shadow .18s ease,
    transform .18s ease,
    background .18s ease;
  box-shadow:
    0 1px 2px rgba(15,23,42,.03),
    0 4px 12px rgba(15,23,42,.03);
}

textarea{
  min-height:88px;
  line-height:1.5;
}

input[type=text]::placeholder,
textarea::placeholder{
  color:#94a3b8;
}

input[type=text]:hover,
textarea:hover{
  border-color:#cbd5e1;
}

input[type=text]:focus,
textarea:focus{
  outline:none;
  border-color:#25D366;
  background:#fff;
  transform:translateY(-1px);
  box-shadow:
    0 0 0 4px rgba(37,211,102,.12),
    0 10px 25px rgba(37,211,102,.10);
}

.div{
  height:1px;
  background:linear-gradient(to right, transparent, #dbe4ea, transparent);
  margin:1.4rem 0;
}

.sc{
  border:1px solid rgba(226,232,240,.9);
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(10px);
  box-shadow:
    0 4px 14px rgba(15,23,42,.04),
    0 1px 3px rgba(15,23,42,.03);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.sc:hover{
  transform:translateY(-2px);
  border-color:rgba(37,211,102,.28);
  box-shadow:
    0 10px 28px rgba(15,23,42,.07),
    0 3px 10px rgba(15,23,42,.04);
}

.sh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.sn{
  font-size:14px;
  font-weight:700;
  color:#0f172a;
}

.rc{
  background:#fff;
  border:1px solid #eef2f7;
  border-radius:18px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:0 2px 10px rgba(15,23,42,.03);
}

.rh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.rn{
  font-size:11px;
  color:#64748b;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.if2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.bi{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:7px 10px;
  cursor:pointer;
  font-size:12px;
  color:#475569;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:all .18s ease;
}

.bi:hover{
  background:#f8fafc;
  color:#0f172a;
  border-color:#cbd5e1;
}

.bi.d:hover{
  background:#fff1f2;
  color:#dc2626;
  border-color:#fecdd3;
}

.ba{
  width:100%;
  padding:11px;
  font-size:13px;
  font-weight:600;
  color:#16a34a;
  border:1.5px dashed rgba(37,211,102,.5);
  border-radius:16px;
  background:rgba(37,211,102,.04);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-top:8px;
  transition:all .18s ease;
}

.ba:hover{
  background:rgba(37,211,102,.08);
  border-color:#25D366;
  transform:translateY(-1px);
}

.ea{
  display:flex;
  gap:10px;
  margin-top:1.4rem;
}

.bp{
  background:linear-gradient(135deg,#25D366,#1fb857);
  color:#fff;
  border:none;
  border-radius:16px;
  padding:11px 18px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  box-shadow:
    0 10px 20px rgba(37,211,102,.18),
    0 3px 8px rgba(37,211,102,.12);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease;
}

.bp:hover{
  transform:translateY(-2px);
  filter:brightness(1.02);
  box-shadow:
    0 14px 28px rgba(37,211,102,.22),
    0 4px 10px rgba(37,211,102,.16);
}

.bss{
  background:#fff;
  color:#475569;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:11px 18px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all .18s ease;
}

.bss:hover{
  background:#f8fafc;
  border-color:#cbd5e1;
  color:#0f172a;
}
.phone{width:248px;background:#fff;border-radius:36px;overflow:hidden;border:3px solid #222;position:relative;display:flex;flex-direction:column}
.notch-bar{background:#111;height:28px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.notch{width:72px;height:14px;background:#111;border-radius:0 0 12px 12px;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2}
.notch-inner{width:52px;height:10px;background:#1a1a1a;border-radius:0 0 9px 9px;margin:0 auto}
.status-bar{background:#075E54;padding:4px 12px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sb-time{font-size:10px;color:#fff;font-weight:600}
.sb-icons{display:flex;align-items:center;gap:3px;color:#fff}
.chat-bar{background:#075E54;padding:8px 10px;color:#fff;display:flex;align-items:center;gap:8px;flex-shrink:0}
.cav{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.cinfo{flex:1}
.cname{font-size:13px;font-weight:600}
.conl{font-size:10px;opacity:.75}
.cicons{display:flex;gap:10px;font-size:16px;opacity:.85}
.pchat{background:#e5ddd5;flex:1;padding:12px 8px 8px;position:relative;overflow:hidden;min-height:420px}
.chat-bg{position:absolute;inset:0;opacity:.06;background-image:repeating-linear-gradient(45deg,#000 0,#000 1px,transparent 0,transparent 50%);background-size:20px 20px}
.bubble{background:#fff;border-radius:10px 10px 10px 3px;max-width:210px;overflow:hidden;position:relative;z-index:1}
.bh{background:#e7fce7;padding:8px 11px 6px;font-size:13px;font-weight:600;color:#111;border-bottom:0.5px solid #d4f5d4;word-break:break-word;line-height:1.3}
.bb{padding:7px 11px 3px;font-size:13px;color:#111;line-height:1.5;word-break:break-word}
.bf{padding:1px 11px 5px;font-size:11px;color:#999;word-break:break-word}
.bbtn{border-top:0.5px solid #e8e8e8;padding:8px 11px;display:flex;align-items:center;justify-content:center;gap:6px;color:#128C7E;font-size:13px;font-weight:500;cursor:pointer;user-select:none;background:#fff}
.bbtn:hover{background:#f5fffe}
.bbtn i{font-size:15px}
.btime{font-size:10px;color:#aaa;text-align:right;padding:0 9px 6px;display:flex;align-items:center;justify-content:flex-end;gap:3px}
.ticks{color:#53bdeb;font-size:12px}
.sheet-wrap{position:absolute;left:0;right:0;bottom:0;top:0;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.sheet-wrap.open{pointer-events:all}
.sheet-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .25s;z-index:1}
.sheet-wrap.open .sheet-overlay{background:rgba(0,0,0,.45)}
.sheet{background:#fff;border-radius:16px 16px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);position:relative;z-index:2;max-height:72%}
.sheet-wrap.open .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:10px auto 6px}
.sheet-top{padding:4px 14px 10px;border-bottom:0.5px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.sheet-title{font-size:14px;font-weight:600;color:#111}
.sheet-close{width:24px;height:24px;border-radius:50%;background:#f2f2f2;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:#555;flex-shrink:0}
.sheet-body{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:rgba(37,211,102,.35) transparent}
.sheet-body::-webkit-scrollbar{width:3px}
.sheet-body::-webkit-scrollbar-track{background:transparent}
.sheet-body::-webkit-scrollbar-thumb{background:rgba(37,211,102,.4);border-radius:2px}
.sec-group{padding:6px 0 2px}
.sec-hdr{font-size:11px;font-weight:700;color:#8696a0;text-transform:uppercase;letter-spacing:.07em;padding:6px 14px 8px}
.row-item{display:flex;align-items:flex-start;padding:10px 14px;cursor:pointer}
.row-item:not(:last-child){border-bottom:0.5px solid #f5f5f5}
.row-item:active{background:#f0fdf4}
.row-text .rt{font-size:13px;font-weight:500;color:#111;line-height:1.3}
.row-text .rd{font-size:12px;color:#8696a0;margin-top:2px;line-height:1.3}
.input-bar{background:#f0f0f0;padding:7px 8px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.ib-field{flex:1;background:#fff;border-radius:20px;padding:7px 12px;font-size:12px;color:#888;border:none}
.ib-mic{width:32px;height:32px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0}
.jb{background:rgba(0,0,0,.15);border:0.5px solid rgba(255,255,255,.15);border-radius:var(--border-radius-md);padding:9px;font-family:var(--font-mono);font-size:10px;color:#fff;white-space:pre-wrap;word-break:break-all;max-height:110px;overflow-y:auto;line-height:1.5;width:100%;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.jb::-webkit-scrollbar{width:3px}
.jb::-webkit-scrollbar-track{background:transparent}
.jb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:2px}
.cr{display:flex;align-items:center;justify-content:space-between;width:100%}
.cm{font-size:11px;color:#a8f0c0}
.prev-lbl{font-size:11px;color:rgba(255,255,255,.7);text-align:center}
</style>

<h2 class="sr-only">Editor WhatsApp List Menu com preview interativo de celular</h2>

<div class="app">
  <div class="editor" id="editor">
    <div class="sec-lbl"><i class="ti ti-message-circle" aria-hidden="true"></i> Mensagem</div>
    <div class="fg">
      <label class="fl" for="f-to">Destinatário <span>(número)</span></label>
      <input type="text" id="f-to" placeholder="+5511999999999" />
    </div>
    <div class="fg">
      <label class="fl" for="f-header">Cabeçalho <span>(opcional)</span></label>
      <input type="text" id="f-header" placeholder="Título da mensagem" />
    </div>
    <div class="fg">
      <label class="fl" for="f-body">Corpo</label>

    </div>
    <div class="fg">

      </div>

          <i class="ti ti-wifi" style="font-size:11px" aria-hidden="true"></i>
          <i class="ti ti-signal-4g" style="font-size:11px" aria-hidden="true"></i>

      <span class="cm" id="copied-msg" style="display:none">Copiado!</span>
    </div>

</div>

<script>
const state={
  to:'',header:'Olá! Como posso te ajudar?',body:'Escolha uma das opções abaixo para continuar.',
  footer:'Responda com uma das opções',button:'Ver opções',
  sections:[
    {title:'Atendimento',rows:[
      {id:'row_1',title:'Suporte técnico',description:'Problemas com o sistema'},
      {id:'row_2',title:'Financeiro',description:'Dúvidas sobre pagamentos'}
    ]},
    {title:'Informações',rows:[
      {id:'row_3',title:'Horário de funcionamento',description:'Seg a Sex, 8h–18h'},
      {id:'row_4',title:'Falar com um humano',description:'Atendimento personalizado'}
    ]}
  ]
};

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function buildJSON(){
  const interactive={type:"list"};
  if(state.header&&state.header.trim()) interactive.header={type:"text",text:state.header.trim()};
  interactive.body={text:state.body||"<MESSAGE_BODY_TEXT>"};
  if(state.footer&&state.footer.trim()) interactive.footer={text:state.footer.trim()};
  interactive.action={button:state.button||"<BUTTON_TEXT>",sections:state.sections.map(s=>({title:s.title||"<SECTION_TITLE>",rows:s.rows.map(r=>({id:r.id||"<ROW_ID>",title:r.title||"<ROW_TITLE>",description:r.description||"<ROW_DESCRIPTION>"}))}))};
  return{type:"interactive",interactive};
}

function renderSheet(){
  const body=document.getElementById('sheet-body');
  document.getElementById('sheet-title').textContent=state.button||'Opções';
  body.innerHTML='';
  state.sections.forEach((sec,si)=>{
    const g=document.createElement('div');g.className='sec-group';
    if(sec.title){const h=document.createElement('div');h.className='sec-hdr';h.textContent=sec.title;g.appendChild(h);}
    sec.rows.forEach((row,ri)=>{
      const item=document.createElement('div');item.className='row-item';
      item.innerHTML=`<div class="row-text"><div class="rt">${esc(row.title)||'(sem título)'}</div>${row.description?`<div class="rd">${esc(row.description)}</div>`:''}</div>`;
      item.addEventListener('click',()=>closeSheet());
      g.appendChild(item);
    });
    body.appendChild(g);
  });
}

function openSheet(){renderSheet();document.getElementById('sheet-wrap').classList.add('open');}
function closeSheet(){document.getElementById('sheet-wrap').classList.remove('open');}

document.getElementById('prev-btn-trigger').addEventListener('click',openSheet);
document.getElementById('sheet-close').addEventListener('click',closeSheet);
document.getElementById('sheet-overlay').addEventListener('click',closeSheet);

function updatePreview(){
  const hdr=document.getElementById('prev-header');
  const ftr=document.getElementById('prev-footer');
  if(state.header&&state.header.trim()){hdr.textContent=state.header;hdr.style.display='';}
  else hdr.style.display='none';
  document.getElementById('prev-body').textContent=state.body||'Texto do corpo.';
  if(state.footer&&state.footer.trim()){ftr.textContent=state.footer;ftr.style.display='';}
  else ftr.style.display='none';
  document.getElementById('prev-btn-text').textContent=state.button||'Ver opções';
  document.getElementById('json-output').textContent=JSON.stringify(buildJSON(),null,2);
  if(document.getElementById('sheet-wrap').classList.contains('open'))renderSheet();
}

function renderSections(){
  const container=document.getElementById('sections-container');container.innerHTML='';
  state.sections.forEach((sec,si)=>{
    const sc=document.createElement('div');sc.className='sc';
    sc.innerHTML=`
      <div class="sh">
        <span class="sn">Seção ${si+1}</span>
        <button class="bi d" data-del-sec="${si}" aria-label="Remover seção"><i class="ti ti-trash" aria-hidden="true"></i> Remover</button>
      </div>
      <div class="fg" style="margin-bottom:8px">
        <label class="fl">Título da seção</label>
        <input type="text" value="${esc(sec.title)}" data-sec-title="${si}" placeholder="Título" />
      </div>
      <div class="sec-lbl" style="margin-bottom:6px;font-size:10px"><i class="ti ti-rows" aria-hidden="true"></i> Itens</div>
      <div id="rows-${si}"></div>
      <button class="ba" data-add-row="${si}"><i class="ti ti-plus" aria-hidden="true"></i> Adicionar item</button>`;
    container.appendChild(sc);
    const rowsEl=document.getElementById(`rows-${si}`);
    sec.rows.forEach((row,ri)=>{
      const rc=document.createElement('div');rc.className='rc';
      rc.innerHTML=`
        <div class="rh">
          <span class="rn">Item ${ri+1}</span>
          <button class="bi d" data-del-row="${si}-${ri}" aria-label="Remover item"><i class="ti ti-trash" aria-hidden="true"></i> Remover</button>
        </div>
        <div class="if2" style="margin-bottom:6px">
          <div><label class="fl">Título</label><input type="text" value="${esc(row.title)}" data-row-title="${si}-${ri}" placeholder="Título" /></div>
          <div><label class="fl">ID <span>(único)</span></label><input type="text" value="${esc(row.id)}" data-row-id="${si}-${ri}" placeholder="row_id" /></div>
        </div>
        <div><label class="fl">Descrição</label><input type="text" value="${esc(row.description)}" data-row-desc="${si}-${ri}" placeholder="Descrição" /></div>`;
      rowsEl.appendChild(rc);
    });
  });
  bindEvents();updatePreview();
}

function bindEvents(){
  document.querySelectorAll('[data-sec-title]').forEach(el=>el.addEventListener('input',e=>{state.sections[+e.target.dataset.secTitle].title=e.target.value;updatePreview();}));
  document.querySelectorAll('[data-row-title]').forEach(el=>el.addEventListener('input',e=>{const[si,ri]=e.target.dataset.rowTitle.split('-').map(Number);state.sections[si].rows[ri].title=e.target.value;updatePreview();}));
  document.querySelectorAll('[data-row-id]').forEach(el=>el.addEventListener('input',e=>{const[si,ri]=e.target.dataset.rowId.split('-').map(Number);state.sections[si].rows[ri].id=e.target.value;updatePreview();}));
  document.querySelectorAll('[data-row-desc]').forEach(el=>el.addEventListener('input',e=>{const[si,ri]=e.target.dataset.rowDesc.split('-').map(Number);state.sections[si].rows[ri].description=e.target.value;updatePreview();}));
  document.querySelectorAll('[data-del-sec]').forEach(el=>el.addEventListener('click',e=>{state.sections.splice(+e.currentTarget.dataset.delSec,1);renderSections();}));
  document.querySelectorAll('[data-del-row]').forEach(el=>el.addEventListener('click',e=>{const[si,ri]=e.currentTarget.dataset.delRow.split('-').map(Number);state.sections[si].rows.splice(ri,1);renderSections();}));
  document.querySelectorAll('[data-add-row]').forEach(el=>el.addEventListener('click',e=>{const si=+e.currentTarget.dataset.addRow;state.sections[si].rows.push({id:`row_${Date.now()}`,title:`Opção ${state.sections[si].rows.length+1}`,description:''});renderSections();}));
}

document.getElementById('f-to').value=state.to;
document.getElementById('f-header').value=state.header;
document.getElementById('f-body').value=state.body;
document.getElementById('f-footer').value=state.footer;
document.getElementById('f-button').value=state.button;

['f-to','f-header','f-body','f-footer','f-button'].forEach(id=>{
  const map={'f-to':'to','f-header':'header','f-body':'body','f-footer':'footer','f-button':'button'};
  document.getElementById(id).addEventListener('input',e=>{state[map[id]]=e.target.value;updatePreview();});
});

document.getElementById('add-section').addEventListener('click',()=>{
  const si=state.sections.length+1;
  state.sections.push({title:`Seção ${si}`,rows:[{id:`row_${Date.now()}`,title:'Opção 1',description:''}]});
  renderSections();
});

document.getElementById('copy-json').addEventListener('click',()=>{
  navigator.clipboard.writeText(JSON.stringify(buildJSON(),null,2)).then(()=>{
    const m=document.getElementById('copied-msg');m.style.display='inline';setTimeout(()=>m.style.display='none',2000);
  });
});

document.getElementById('reset-btn').addEventListener('click',()=>{
  if(!confirm('Resetar todos os campos?'))return;
  Object.assign(state,{to:'',header:'',body:'',footer:'',button:'Ver opções',sections:[{title:'Seção 1',rows:[{id:'row_1',title:'',description:''}]}]});
  ['f-to','f-header','f-body','f-footer'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-button').value='Ver opções';
  renderSections();
});

renderSections();
</script>
